[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obds-reference"
version = "1.0.0"
description = "Minimal neutral reference compiler for OBDS Foundation 1.0.0"
requires-python = ">=3.13"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "regex>=2025.0"
]

[project.scripts]
obds = "obds_ref.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
